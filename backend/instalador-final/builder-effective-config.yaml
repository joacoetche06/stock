directories:
  output: instalador-final
  buildResources: build
appId: com.joaco.chicas
productName: Chicas de Buenos Aires
files:
  - filter:
      - dist/**/*
      - public/**/*
      - main.js
      - package.json
      - config.json
extraResources:
  - filter:
      - app-adri.sqlite
win:
  target: nsis
  icon: public/frontend/browser/logo.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Chicas de Buenos Aires
electronVersion: 41.1.1
