<div>
  <h2>Gestión de Vendedores</h2>

  <div
    [style.background]="editandoId() ? '#fff3cd' : '#e9ecef'"
    style="
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      max-width: 600px;
      border: 1px solid #ccc;
    "
  >
    <h3 style="margin-top: 0">
      {{ editandoId() ? '✏️ Editando Vendedora' : 'Cargar Nueva Vendedora' }}
    </h3>

    <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center">
      <input
        type="text"
        placeholder="Nombre completo"
        [(ngModel)]="nuevoVendedor.nombre"
        style="padding: 8px; flex-grow: 1"
      />
      <input
        type="text"
        placeholder="Teléfono"
        [(ngModel)]="nuevoVendedor.telefono"
        style="padding: 8px; width: 150px"
      />

      <button
        (click)="guardarVendedor()"
        [style.background]="editandoId() ? '#ffc107' : '#007bff'"
        style="
          padding: 9px 15px;
          color: black;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          font-weight: bold;
        "
      >
        {{ editandoId() ? '💾 Actualizar' : '+ Agregar' }}
      </button>

      <button
        *ngIf="editandoId()"
        (click)="limpiarFormulario()"
        style="
          padding: 9px 15px;
          background: #6c757d;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
        "
      >
        Cancelar
      </button>
    </div>
  </div>

  <table
    border="1"
    cellpadding="10"
    style="
      border-collapse: collapse;
      width: 100%;
      max-width: 600px;
      text-align: left;
      background: white;
    "
  >
    <thead style="background-color: #343a40; color: white">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let vend of vendedores()">
        <td># {{ vend.id }}</td>
        <td>
          <strong>{{ vend.nombre }}</strong>
        </td>
        <td>{{ vend.telefono || 'Sin teléfono' }}</td>
        <td>
          <button
            (click)="editar(vend)"
            style="
              background: #ffc107;
              border: none;
              padding: 5px 10px;
              border-radius: 4px;
              cursor: pointer;
              font-weight: bold;
            "
          >
            Editar
          </button>

          <button
            (click)="eliminar(vend.id!)"
            style="
              background: #dc3545;
              color: white;
              border: none;
              padding: 5px 10px;
              border-radius: 4px;
              cursor: pointer;
              font-weight: bold;
              margin-left: 5px;
            "
          >
            Eliminar
          </button>
        </td>
      </tr>
      <tr *ngIf="vendedores().length === 0">
        <td colspan="4" style="text-align: center; padding: 20px">No hay vendedoras cargadas.</td>
      </tr>
    </tbody>
  </table>
</div>
